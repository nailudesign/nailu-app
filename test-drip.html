<!DOCTYPE html>
<html>
<head>
<style>
body { background: #f0f0f0; margin: 0; padding: 50px; }
.header {
  width: 100%;
  height: 60px;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(10px);
  position: relative;
  box-shadow: 0 4px 6px rgba(0,0,0,0.05); /* Optional shadow */
}
.drip {
  position: absolute;
  top: 100%;
  left: 0;
  width: 100%;
  height: 20px;
  background: rgba(255,255,255,0.8);
  backdrop-filter: blur(10px);
  -webkit-mask-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 150 25' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M0,0 Q15,0 25,20 Q35,0 50,0 Q65,0 75,15 Q85,0 100,0 Q115,0 125,25 Q135,0 150,0 L150,-10 L0,-10 Z' fill='black'/%3E%3C/svg%3E");
  -webkit-mask-size: 150px 100%;
  -webkit-mask-repeat: repeat-x;
}
</style>
</head>
<body>
  <div class="header">
    <div class="drip"></div>
  </div>
</body>
</html>
